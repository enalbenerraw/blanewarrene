name: Chatham Park grocery watch

on:
  schedule:
    # 11:00 UTC = 7am Eastern in summer (EDT), 6am in winter (EST).
    # For weekly instead of daily, use: "0 11 * * 1"  (Mondays)
    - cron: "0 11 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "What to do"
        type: choice
        default: normal
        options:
          - normal
          - dry-run
          - check-sources
          - test-email

permissions:
  contents: write

concurrency:
  group: chatham-grocery-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: pip install -r requirements.txt

      - name: Run watcher
        env:
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          MODE: ${{ inputs.mode || 'normal' }}
        run: |
          case "$MODE" in
            dry-run)       python watcher.py --dry-run ;;
            check-sources) python watcher.py --check-sources ;;
            test-email)    python watcher.py --test-email ;;
            *)             python watcher.py ;;
          esac

      - name: Save memory of sent items
        if: ${{ (inputs.mode || 'normal') == 'normal' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add seen.json
          if git diff --staged --quiet; then
            echo "No state changes."
          else
            git commit -m "Update Chatham Park grocery watch state"
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
