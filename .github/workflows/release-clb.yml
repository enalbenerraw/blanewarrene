name: Release Market Intelligence plugin

on:
  push:
    tags:
      - 'clb-v*'

permissions:
  contents: write

jobs:
  package-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Validate plugin manifest
        run: |
          MANIFEST="plugins/comparative-landscape-brief/.claude-plugin/plugin.json"
          if [ ! -f "$MANIFEST" ]; then
            echo "ERROR: plugin.json not found at $MANIFEST"
            exit 1
          fi
          python3 -m json.tool "$MANIFEST" > /dev/null
          echo "plugin.json is valid JSON"

      - name: Extract plugin version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('plugins/comparative-landscape-brief/.claude-plugin/plugin.json'))['version'])")
          TAG_VERSION="${GITHUB_REF_NAME#clb-v}"
          echo "manifest_version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag_version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          echo "Manifest version: $VERSION"
          echo "Tag version: $TAG_VERSION"
          if [ "$VERSION" != "$TAG_VERSION" ]; then
            echo "WARNING: tag ($TAG_VERSION) does not match manifest version ($VERSION)"
            echo "Continuing, but consider keeping them in sync."
          fi

      - name: Verify all skills have frontmatter
        run: |
          for skill_md in plugins/comparative-landscape-brief/skills/*/SKILL.md; do
            if ! head -5 "$skill_md" | grep -q "^name:"; then
              echo "ERROR: missing 'name:' frontmatter in $skill_md"
              exit 1
            fi
            echo "OK: $skill_md"
          done

      - name: Check for em dashes (style rule)
        run: |
          if grep -r "—" plugins/comparative-landscape-brief/ > /dev/null 2>&1; then
            echo "ERROR: found em dashes in plugin content (style rule violation)"
            grep -rn "—" plugins/comparative-landscape-brief/ | head -10
            exit 1
          fi
          echo "PASS: no em dashes found"

      - name: Sync marketplace.json on main
        run: |
          PLUGIN_VERSION="${{ steps.version.outputs.manifest_version }}"
          git worktree add /tmp/main-worktree main
          cd /tmp/main-worktree
          MARKETPLACE_FILE=".claude-plugin/marketplace.json"
          CURRENT=$(python3 -c "import json; d=json.load(open('$MARKETPLACE_FILE')); print([p['version'] for p in d['plugins'] if p['name']=='comparative-landscape-brief'][0])")
          if [ "$CURRENT" = "$PLUGIN_VERSION" ]; then
            echo "marketplace.json already at $PLUGIN_VERSION; no update needed"
            exit 0
          fi
          python3 -c "
          import json
          path = '$MARKETPLACE_FILE'
          with open(path) as f:
              data = json.load(f)
          for p in data['plugins']:
              if p['name'] == 'comparative-landscape-brief':
                  p['version'] = '$PLUGIN_VERSION'
          with open(path, 'w') as f:
              json.dump(data, f, indent=2)
              f.write('\n')
          "
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$MARKETPLACE_FILE"
          git commit -m "Sync marketplace.json to comparative-landscape-brief v$PLUGIN_VERSION"
          git push origin main

      - name: Package plugin
        run: |
          cd plugins/comparative-landscape-brief
          zip -r "/tmp/comparative-landscape-brief.plugin" . -x "*.DS_Store"
          ls -la /tmp/comparative-landscape-brief.plugin

      - name: Also create versioned filename
        run: |
          cp "/tmp/comparative-landscape-brief.plugin" "/tmp/comparative-landscape-brief-v${{ steps.version.outputs.tag_version }}.plugin"
          ls -la /tmp/*.plugin

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          name: "Market Intelligence ${{ github.ref_name }}"
          body: |
            **Market Intelligence** ${{ github.ref_name }}

            Market intelligence for product and GTM leaders. Five skills share one hardened research subagent that verifies quantitative claims against third-party sources and refuses instructions embedded in fetched pages.

            ## Install

            Download `comparative-landscape-brief.plugin` below, then in Claude Cowork or Claude Code:

            1. Open the plugin install panel
            2. Drop in the `.plugin` file
            3. Confirm install

            | Skill | Ask it when |
            |-------|-------------|
            | `comparative-landscape-brief` | 3 to 8 entities side by side for a third-party audience |
            | `signal-watch` | One company, understanding rather than preparing |
            | `competitive-brief-generator` | One company against its rivals, as styled HTML and PDF |
            | `strategic-gtm-intel` | Your company against one named competitor |
            | `pre-call-briefing` | A commercial call already on the calendar |

            Each skill triggers automatically. Every `when_to_use` names its discriminator so routing between them is deterministic.

            Installs as `comparative-landscape-brief`. Only the display name changed in 0.5.0, so existing installs and the `clb-v*` tags keep working.

            ## Marketplace install

            ```bash
            claude plugin marketplace add enalbenerraw/blanewarrene
            claude plugin install comparative-landscape-brief@blanewarrene-marketplace
            ```

            ## What's in this release

            See `plugins/comparative-landscape-brief/README.md` for full details.

            ---

            *Created by Blane Warrene, blanewarrene.com*
          files: |
            /tmp/comparative-landscape-brief.plugin
            /tmp/comparative-landscape-brief-v${{ steps.version.outputs.tag_version }}.plugin
          draft: false
          prerelease: false
